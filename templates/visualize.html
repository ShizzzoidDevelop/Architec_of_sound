<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Visualizer | Architect of Sound</title>

  <link rel="stylesheet" href="/static/assets/css/AOS.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <style>
    #threeContainer {
      width: 100%;
      height: 600px;
      background: #000;
      display: none;
      position: relative;
    }
  </style>
</head>

<body>
  <header>
    <h1>Architect of Sound</h1>
    <nav>
      <ul>
        <li><a href="AOS.html">Home</a></li>
        <li><a href="visualize.html" class="active">Visualizer</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="intro" id="intro">
      <h2>Audio Visualizer</h2>
      <p>Нажми на кнопку, чтобы запустить визуализацию</p>
      <button id="start-btn" class="btn">Start Visualization</button>
    </div>

    <div id="threeContainer"></div>
  </main>

  <footer><p>© 2025 Architect of Sound</p></footer>

  <script type="module">
    import { startVisualizer } from '/static/assets/js/visualizer.js';

    window.addEventListener('DOMContentLoaded', () => {
      const intro = document.getElementById('intro');
      const btn = document.getElementById('start-btn');
      const box = document.getElementById('threeContainer');

      btn.addEventListener('click', () => {
        intro.style.display = 'none';
        box.style.display = 'block';
        setTimeout(() => {
          startVisualizer(box);
        }, 50);
      });
    });
  </script>
</body>
</html>
